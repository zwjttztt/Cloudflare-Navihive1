# NaviHive 自托管 —— kPanel「部署 Docker 应用」专用，粘贴即用。
#
# 怎么用（详见 deploy/vps-redeploy-runbook-2026-10-16.md）：
#   kPanel → Docker → 部署应用 → 把下面**整个文件**粘进「粘贴部署内容」框
#   （替换掉预填的 docker run 示例）→ 改掉 AUTH_SECRET / AUTH_PASSWORD → 部署。
#
# 镜像来源二选一：
#   A. ghcr.io/zwjttztt/navihive:latest —— GitHub Actions 构建推送（推荐，VPS 不用编译）
#   B. navihive:latest                 —— VPS 上 git clone + docker compose build 本地构建
#   用 B 就把下面 image 那一行改成 navihive:latest。
#
# 注意：这份文件里**不要**出现 ${VAR} 占位——kPanel 的部署目录里没有 .env，
# 插值会直接把服务拦成起不来。要改的值都是字面量，部署前手工替换。

services:
  navihive:
    image: ghcr.io/zwjttztt/navihive:latest
    container_name: navihive
    restart: unless-stopped

    ports:
      # 只绑宿主机回环：TLS 由 kPanel 的网站反代终止，容器不直接面对公网。
      # kPanel 里「网站 → 反向代理」的目标填 http://127.0.0.1:8787
      - "127.0.0.1:8787:8787"

    environment:
      # 容器内必须听 0.0.0.0，端口映射才通得出去（写 127.0.0.1 会端口映射全废、零报错）
      NAVIHIVE_HOST: 0.0.0.0
      NAVIHIVE_PORT: "8787"
      # 库与附件落在命名卷里，容器重建 / 换镜像都不丢
      NAVIHIVE_DB: /app/data/navihive.db
      NAVIHIVE_FILES: /app/data/files
      # 挡着反代才保持 1；端口若直接暴露公网必须设 0（否则改 XFF 头就能换限速桶）
      NAVIHIVE_TRUST_XFF: "1"
      # 单容器 = 单实例，进程内定时任务（每周备份 / 死链巡检）放心开
      NAVIHIVE_CRON: "1"
      NAVIHIVE_CRON_TOKEN: ""

      # ↓↓↓ 部署前必改这两项 ↓↓↓
      # AUTH_SECRET 生成：ssh 上 VPS 执行  openssl rand -hex 32
      # ⚠️ 定下来就别再换：换了之后所有已下发的登录令牌全部失效（所有人要重新登录）
      AUTH_SECRET: "在这里贴 openssl rand -hex 32 的输出"
      AUTH_ENABLED: "true"
      # 只在首次建库时当种子账号；库建好之后以库里的账号为准。
      # 首次登录会强制要求改密码（这是设计，不是故障）
      AUTH_USERNAME: "root"
      AUTH_PASSWORD: "在这里设一个初始密码"

    volumes:
      - navihive-data:/app/data

    # SQLite 单写者：别横向扩副本（每个副本各写各的库，定时任务也会各跑一遍）
    deploy:
      replicas: 1

    # 访问日志是每条 API 请求一行，不轮转能把小 VPS 的磁盘写满
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# kPanel 会按自己的项目名给卷加前缀（例如 kpanel_navihive-data），属正常，别手动改。
volumes:
  navihive-data:
