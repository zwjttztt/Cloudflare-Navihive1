# NaviHive 反向代理公共片段
#
# 放到 VPS 的 /etc/nginx/snippets/navi-proxy.conf，由站点配置 include。
#
# ⚠️ 三条硬性要求（改错任何一条都会 502，见 deploy/nginx/README.md）：
#   1. 下面两处的 <WORKERS_DEV_HOST> 必须换成 Worker 自带的 *.workers.dev 主机，
#      **绝不能**写自定义域名 —— DNS 指向 VPS 后，带自定义域的 Host 回源会解析回
#      自己，形成死循环。
#   2. 用 upstream 块（而不是 proxy_pass 里写变量）才能启用 keepalive；
#      代价是主机名只在 Nginx 启动时解析一次，所以配套要加每天 reload 的 timer。
#   3. proxy_set_header Host 必须是源站域名，不能写 $host。

# SNI：用 upstream 主机名做 TLS 的 SNI，显式打开最稳
proxy_ssl_server_name on;
proxy_ssl_protocols TLSv1.2 TLSv1.3;
proxy_ssl_session_reuse on;

# ⚠️ 必须是源站域名（见文件头第 3 条）
proxy_set_header Host              <WORKERS_DEV_HOST>;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# ⚠️⚠️ CSRF（2026-10-14 起这一行是**可选**的双保险，不再是必需）：
#
# 上面这条 Host 改写会顺带打断 Worker 的同源校验。原先 worker/httpUtils.ts 的
# isSameOrigin() 拿 Origin 的 host 和 request.url 的 host 相比，而回源 Host 一
# 改写成 *.workers.dev，Worker 眼里 request.url 就变成了源站主机名 —— 两者不相等，
# 于是**所有写请求**（保存卡片 / 增删改 / 登录）都被判跨站并拒绝。前端
# parseApiError 只认 JSON，解析不出人话，只显示「API错误: 403」。
# 读请求（GET/HEAD）不走这个分支，所以表现为「页面能看、一保存就报错」。
#
# 现在 Worker 侧已修复：isSameOrigin() 改成 **Sec-Fetch-Site 优先** —— 那是浏览器
# 按「发起页面 vs 目标」自己算的禁伪造头，与中间经过几层反代、回源 Host 被改成
# 什么都无关。所以只要浏览器是 Chrome 76+/Firefox 90+/Safari 16.4+，**不配下面
# 这一行也不会再复发**；老浏览器（没有 Sec-Fetch-Site）仍会退回 Origin 判据，
# 那时下面这一行就还有用。
#
# 处理：回源时不转发 Origin 头（nginx 里置空字符串 = 不发送该头），
# 让 Worker 直接走 Sec-Fetch-Site 判据：
#   - 同站 fetch  → Sec-Fetch-Site: same-origin → 放行
#   - 跨站伪造    → Sec-Fetch-Site: cross-site  → 照样拦
# 防护不减弱；老浏览器没有该头时由 SameSite=Strict cookie 兜底。
#
# 备选做法（想保留 Worker 的 Origin 判据时）：用 map 把「自己域名」的 Origin
# 改写成源站主机名，其余一律置空丢弃。见 deploy/nginx/README.md 的坑速查表。
proxy_set_header Origin            "";

# 让源站返回明文，由本机统一 gzip / brotli，避免二次压缩
proxy_set_header Accept-Encoding   "";

# keepalive 三件套：缺一不可，否则每请求都要重新 TLS 握手
proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_redirect off;

# 不带 URI 部分：原样转发原始请求路径（配合 location 前缀不会被改写）
proxy_pass https://navi_origin;
