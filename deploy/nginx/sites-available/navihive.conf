# NaviHive 反向代理站点配置
#
# 放到 /etc/nginx/sites-available/navihive.conf，然后：
#   sudo ln -s /etc/nginx/sites-available/navihive.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#
# 首次上线时证书还不存在，nginx -t 会失败。正确顺序见 README 的「落地步骤」：
#   先只启用 80 端口的最小配置 → 切 DNS → certbot 签证书 → 再启用本文件的 443 部分。
# 切换期间可以用「bootstrap」小节临时顶上。
#
# ⚠️ 本文件是**模板**，不是某一台机器上的成品：所有 server_name（含 bootstrap 注释里那处）
#    与两行 ssl_certificate 路径都必须换成你自己的域名再启用。
#    忘改 server_name 只是匹配不上，排查起来看得见；忘改证书路径会让 nginx 直接起不来。

# ============================ 上游 ============================
# ⚠️ 把 <WORKERS_DEV_HOST> 换成 Worker 自带的 *.workers.dev 主机（与 snippet 里一致）
upstream navi_origin {
    server <WORKERS_DEV_HOST>:443;
    keepalive 32;              # Tokyo → CF 日本边缘只要 2–10ms，复用连接能省掉每次握手
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# 缓存区：只缓存静态资源，/api/ 一律不缓存
proxy_cache_path /var/cache/nginx/navi levels=1:2 keys_zone=navi_cache:32m
                 max_size=1g inactive=7d use_temp_path=off;

# 登录限速：源站侧的限速在反代后会退化成一个桶（见 README「坑 3」），必须在这一层补
limit_req_zone $binary_remote_addr zone=navi_login:10m rate=10r/m;

# ============================ bootstrap（首次上线临时用） ============================
# 证书还没签好时，先用这一段让站点可用（http，不带 Secure cookie，能正常登录）。
# certbot 跑通、443 起来之后，把整个 server 块删掉。
# server {
#     listen 80;
#     server_name <your-host>;
#     client_max_body_size 30m;
#     location / { include snippets/navi-proxy.conf; }
# }

server {
    listen 80;
    server_name <your-host>;

    # certbot 的 HTTP-01 挑战
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;                       # Nginx ≥ 1.25.1；老版本写 listen 443 ssl http2
    server_name <your-host>;

    ssl_certificate     /etc/letsencrypt/live/<your-host>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<your-host>/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;        # 关掉 ticket 以规避 0-RTT 重放风险

    # ---- 压缩：源站已由 snippet 清掉 Accept-Encoding，这里统一压 ----
    # ⚠️ 这份配置**刻意不写** `gzip_proxied any`（自托管那份 navihive-selfhost.conf 里有）。
    #    别「顺手补齐」—— 常见的那两个理由在这条链上都不成立，方向甚至是反的：
    #    ① 上游不是「已经压好了」：snippets/navi-proxy.conf 明确
    #       `proxy_set_header Accept-Encoding ""`，Cloudflare 收到的是「不必压缩」，
    #       回给本机的是 identity —— 压缩责任全在这一层，所以下面这份清单是必需的。
    #    ② `gzip_proxied` 不是「对所有反代响应」的开关。nginx 文档原文：
    #       "The fact that the request is proxied is determined by the presence of the
    #        'Via' request header field" —— 它只对**带 Via 的请求**生效。
    #       浏览器 → CF 边缘 → 本机这条链上没有一跳会加 Via，那行在这里一行都不改变行为。
    #       （自托管那份加了，是「VPS 前面可能还套了一层代理」的保险，不是修复。）
    #    真正让 /api/* 的 JSON 被压的是下一行 gzip_types 里的 application/json
    #    —— nginx 默认只压 text/html。要动就动那儿。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json
               application/manifest+json image/svg+xml;
    # 装了 ngx_brotli 就再加两行，JS 还能小 15–20%

    # ---- 体积上限：附件单文件 25MB（worker/attachments.ts:35），留点余量 ----
    client_max_body_size 30m;

    add_header X-Cache-Status $upstream_cache_status;

    # ---- 静态资源：缓存 30 天，之后基本不再回源 ----
    location /assets/ {
        include snippets/navi-proxy.conf;
        proxy_cache navi_cache;
        proxy_cache_valid 200 206 30d;
        proxy_cache_lock on;                          # 同一资源并发回源只放一个过去
        proxy_ignore_headers Cache-Control Expires;   # 源站已是 immutable，按 30d 存
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- 登录：单独限流（源站侧已退化，见 README「坑 3」）----
    location = /api/login {
        limit_req zone=navi_login burst=5 nodelay;
        include snippets/navi-proxy.conf;
        proxy_cache off;
        proxy_no_cache 1;
    }

    # ---- WebDAV：上传最长约 10 分钟（代码里 uploadTimeoutMs 封顶 10min）----
    location /api/webdav/ {
        include snippets/navi-proxy.conf;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---- 其余 API：不缓存、不缓冲 ----
    location /api/ {
        include snippets/navi-proxy.conf;
        proxy_cache off;
        proxy_buffering off;          # ⚠️ 导入进度是 NDJSON 流式（见 README「坑 4」）
        proxy_request_buffering off;  # 25MB 附件别先在 VPS 落盘再转发
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- SPA 兜底：首页 HTML 源站 max-age=60，跟着走 ----
    location / {
        include snippets/navi-proxy.conf;
        proxy_cache navi_cache;
        proxy_cache_valid 200 1m;
    }
}
