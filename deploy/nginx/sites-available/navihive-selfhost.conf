# NaviHive 自托管（方案 B）站点配置
#
# 放到 /etc/nginx/sites-available/navihive-selfhost.conf，然后：
#   sudo ln -s /etc/nginx/sites-available/navihive-selfhost.conf /etc/nginx-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 与 sites-available/navihive.conf（方案 A：反代到 Cloudflare）的区别只有**上游**：
# 那里指 *.workers.dev，这里指本机的 Node 进程。其余安全头 / 缓存策略仍由
# dist/client/_headers 在 Node 侧统一发（见 ../selfhost.md「为什么静态也走 Node」）。
#
# 前置：先按 ../selfhost.md 把服务跑起来（默认监听 127.0.0.1:8787），再上本文件。

# 登录限速。源站侧按 X-Forwarded-For 分桶（NAVIHIVE_TRUST_XFF=1 时），
# 但限速是「软」的；这一层按真实对端 IP 硬限一道，爆破成本直接抬上去。
limit_req_zone $binary_remote_addr zone=navi_login:10m rate=10r/m;

server {
    listen 80;
    server_name myhp.zwjttzt.com;

    # certbot 的 HTTP-01 挑战
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;                       # Nginx ≥ 1.25.1；老版本写 listen 443 ssl http2
    server_name myhp.zwjttzt.com;

    ssl_certificate     /etc/letsencrypt/live/myhp.zwjttzt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myhp.zwjttzt.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;        # 关掉 ticket 以规避 0-RTT 重放风险

    # ⚠️ 这四行必须挂在 **server 级**，不能只写在 location / 里。
    # nginx 的继承规则是「当前级别一条 proxy_set_header 都没有，才继承上级」——
    # 所以写在 location / 里的那几行对 /assets/、/api/login、/api/webdav/ 一律不生效
    # （它们是平级 location，不会去继承兄弟块）。踩出来的两个后果：
    #   1) /api/login 拿不到 X-Forwarded-For → 源站侧 clientBucket() 退成 "unknown"，
    #      应用层「连错 5 次锁几分钟」的限速变成**全场共用一个桶**：一个人输错密码，
    #      所有人在接下来几分钟内都登不上（Nginx 那层 limit_req 按 $binary_remote_addr
    #      是好的，但它是软限，挡不住这个）。
    #   2) 这三个 location 也拿不到 X-Forwarded-Proto → cookie 少了 Secure。
    # 修法就是把它们提到所有 location 的公共上级。
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;   # ⚠️ 必须：决定 cookie 的 Secure
    proxy_http_version 1.1;

    # ---- 压缩：Node 侧不压缩，这一层是唯一的 gzip/brotli 机会 ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json
               application/manifest+json image/svg+xml;
    # 装了 ngx_brotli 就再加两行，JS 还能小 15–20%

    # ---- 体积上限：附件单文件 25MB（worker/attachments.ts:35），留点余量 ----
    client_max_body_size 30m;

    # ---- 带 hash 的构建产物：Nginx 缓存 30 天，之后基本不再回源 ----
    # 上游对这些路径发的是 immutable，且不带 Set-Cookie / Vary，可以放心缓存
    location /assets/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_cache navi_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;                          # 同一资源并发回源只放一个过去
        proxy_ignore_headers Cache-Control Expires;   # 上游已是 immutable，按 30d 存
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- 登录：单独限流 ----
    location = /api/login {
        limit_req zone=navi_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
    }

    # ---- WebDAV：上传最长约 10 分钟（代码里 uploadTimeoutMs 封顶 10min）----
    location /api/webdav/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_request_buffering off;   # 大文件别先在 VPS 落盘再转发
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---- 其余全部（API + 静态 + SPA fallback）：不缓存、不缓冲 ----
    # 导入进度是 NDJSON 流式，缓冲会让进度条卡在最后一下
    location / {
        proxy_pass http://127.0.0.1:8787;
        # 请求头在 server 级统一设了（理由见上面那段），这里只留本块特有的：
        # 导入进度是 NDJSON 流式，缓冲会让进度条卡在最后一下
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# 缓存区声明要放在 http 块里。Debian/Ubuntu 的 sites-enabled 是在 http 块内
# include 的，写在这里有效；用 conf.d 的发行版请把这两行挪到 conf.d 开头。
proxy_cache_path /var/cache/nginx/navi levels=1:2 keys_zone=navi_cache:32m
                 max_size=1g inactive=7d use_temp_path=off;
