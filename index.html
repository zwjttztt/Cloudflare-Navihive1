<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1976d2" />
    <meta name="description" content="个人导航站，整理和分享您喜爱的网站链接" />
    <!--
      三个图标链接都带 `?v=__ICON_V__`（构建时替换成发布版本号，见 vite.config.ts
      的 versionedIcons）。不带的话浏览器会一直用自己那份 favicon 缓存：
      16.3.0 换了 logo 图，标签页却还是旧的蓝圆图 —— 用户的结论就是「logo 没变」。
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=__ICON_V__" />
    <link rel="alternate icon" href="/favicon.ico?v=__ICON_V__" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=__ICON_V__" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Navihive" />

    <!-- 分享到微信 / QQ / 社交平台时的卡片信息 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Navihive" />
    <meta property="og:title" content="Navihive 导航站" />
    <meta property="og:description" content="个人导航站，整理和分享您喜爱的网站链接" />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Navihive 导航站" />
    <meta name="twitter:description" content="个人导航站，整理和分享您喜爱的网站链接" />
    <meta name="twitter:image" content="/icons/icon-512.png" />

    <title>Navihive 导航站</title>

    <!--
      骨架阶段同步一次「已存的外观设置」（主题 + 圆角），见 public/boot-theme.js。

      ⚠️ 刻意写成**外链**而不是内联：全站 CSP 是 `script-src 'self'`
      （public/_headers，没有 'unsafe-inline'），内联脚本在 Pages 部署下会被拦掉，
      而本地 dev 正常 —— 这种只在上线后失效的问题最难查。

      这段只干三件事（读两个 localStorage 键 + 两个赋值），几百字节、不发请求，
      同步跑完就在首帧之前。React 挂载后会把 --card-radius 写到 .nav-root
      （比 <html> 更具体的元素），两边不打架。
    -->
    <script src="/boot-theme.js"></script>

    <!--
      首屏兜底：主模块脚本没执行（chunk 404 / 旧外壳引用了已删 chunk / 线路抽风）时，
      页面会永久停在下面那段纯 CSS 骨架里 —— 所有自救代码都在那个跑不起来的 bundle 里，
      救不了自己。这段外链脚本只看「15 秒后骨架还在不在」，在就清 SW 缓存 + 注销 + 刷一次。
      同会话只救一次，服务器真挂了不会无限刷新。实现与理由见 public/boot-guard.js。
      ⚠️ 必须保持外链：CSP 是 script-src 'self'，内联会被拦。
    -->
    <script src="/boot-guard.js" defer></script>

    <!--
      启动占位（纯 CSS，无 JS / 无外链）：居中一个转圈。

      为什么必须有这一段：`<div id="root">` 原本是空的，而 React 侧的加载态也要等
      首屏那批 JS（gzip 约 285 KB）下载完才会渲染。也就是说从 HTML 到达到 React 挂载
      之间是**纯白屏**，弱网下能白几秒。这段内联 CSS 在 HTML 到达的同一帧就把转圈画
      出来，这段等待才有反馈。内联是刻意的：外链 CSS 又是一次往返。

      ⚠️ 2026-11-06 用户反馈：原来这里画的是「顶栏 + 两组卡片占位」的**假骨架**。
      弱网下用户先看到一整屏假卡片、几百毫秒后才跳成真实的加载态转圈 ——
      观感像「内容已经在加载了其实没有」，前半屏的等待全白费，还得再跳一次形态。
      所以改成只给一个转圈：React 侧的加载态（App.tsx 的 loading 分支）也是同一个
      40px 转圈，两侧视觉一致，从打开到内容出现是「转圈 → 内容」，中间不再有形态跳变。

      元素 id 仍沿用 boot-skeleton（boot-guard.js 的 SKELETON_ID 与 main.tsx 的
      requestAnimationFrame 都按这个 id 找活：前者判「React 到底挂没挂载」，
      后者负责删节点），但内容已经不是一个骨架了 —— 别按 id 的字面意思理解。
      ⚠️ 改名会同时打断那两条链路，别改。

      CSP 允许 `style-src 'self' 'unsafe-inline'`（MUI/emotion 运行时插样式需要），
      所以这里不需要 nonce。转圈本身无任何文本，不参与对比度/焦点审计。
    -->
    <style>
      #boot-skeleton {
        --bs-bg: #f7f8fa;
        --bs-brand: #1976d2;
        position: fixed;
        inset: 0;
        z-index: 0;
        background: var(--bs-bg);
        padding: 20px;
        box-sizing: border-box;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Inter, "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        #boot-skeleton {
          --bs-bg: #12161c;
          --bs-brand: #90caf9;
        }
      }
      /* 用户存过 light/dark 时以它为准：这两条选择器比上面的 #boot-skeleton 具体，
         会盖过 @media 那条（存的是 system 时 head 里那段脚本不写属性，继续跟系统）。 */
      html[data-boot-theme="dark"] #boot-skeleton {
        --bs-bg: #12161c;
        --bs-brand: #90caf9;
      }
      html[data-boot-theme="light"] #boot-skeleton {
        --bs-bg: #f7f8fa;
        --bs-brand: #1976d2;
      }
      /* 与 MUI CircularProgress 的默认外观对齐：40px、primary 色、0.9s 线性旋转。
         尺寸/节奏一致，React 接管的瞬间看不出换了执行者。 */
      #boot-skeleton .bs-spinner {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        box-sizing: border-box;
        border: 3.5px solid color-mix(in srgb, var(--bs-brand) 22%, transparent);
        border-top-color: var(--bs-brand);
        animation: bs-spin 0.9s linear infinite;
      }
      @keyframes bs-spin {
        to { transform: rotate(360deg); }
      }
      /* 尊重系统的「减少动效」：只留静态圆环，旋转会让人分心（前庭敏感） */
      @media (prefers-reduced-motion: reduce) {
        #boot-skeleton .bs-spinner { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- 与上面的 #boot-skeleton 样式配套；React 挂载后由 main.tsx 兜底移除 -->
      <div id="boot-skeleton" aria-hidden="true">
        <div class="bs-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
