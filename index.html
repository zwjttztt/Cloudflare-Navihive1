<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1976d2" />
    <meta name="description" content="个人导航站，整理和分享您喜爱的网站链接" />
    <!--
      三个图标链接都带 `?v=__ICON_V__`（构建时替换成发布版本号，见 vite.config.ts
      的 versionedIcons）。不带的话浏览器会一直用自己那份 favicon 缓存：
      16.3.0 换了 logo 图，标签页却还是旧的蓝圆图 —— 用户的结论就是「logo 没变」。
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=__ICON_V__" />
    <link rel="alternate icon" href="/favicon.ico?v=__ICON_V__" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=__ICON_V__" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Navihive" />

    <!-- 分享到微信 / QQ / 社交平台时的卡片信息 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Navihive" />
    <meta property="og:title" content="Navihive 导航站" />
    <meta property="og:description" content="个人导航站，整理和分享您喜爱的网站链接" />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Navihive 导航站" />
    <meta name="twitter:description" content="个人导航站，整理和分享您喜爱的网站链接" />
    <meta name="twitter:image" content="/icons/icon-512.png" />

    <title>Navihive 导航站</title>

    <!--
      骨架阶段同步一次「已存的外观设置」（主题 + 圆角），见 public/boot-theme.js。

      ⚠️ 刻意写成**外链**而不是内联：全站 CSP 是 `script-src 'self'`
      （public/_headers，没有 'unsafe-inline'），内联脚本在 Pages 部署下会被拦掉，
      而本地 dev 正常 —— 这种只在上线后失效的问题最难查。

      这段只干三件事（读两个 localStorage 键 + 两个赋值），几百字节、不发请求，
      同步跑完就在首帧之前。React 挂载后会把 --card-radius 写到 .nav-root
      （比 <html> 更具体的元素），两边不打架。
    -->
    <script src="/boot-theme.js"></script>

    <!--
      首屏兜底：主模块脚本没执行（chunk 404 / 旧外壳引用了已删 chunk / 线路抽风）时，
      页面会永久停在下面那段纯 CSS 骨架里 —— 所有自救代码都在那个跑不起来的 bundle 里，
      救不了自己。这段外链脚本只看「15 秒后骨架还在不在」，在就清 SW 缓存 + 注销 + 刷一次。
      同会话只救一次，服务器真挂了不会无限刷新。实现与理由见 public/boot-guard.js。
      ⚠️ 必须保持外链：CSP 是 script-src 'self'，内联会被拦。
    -->
    <script src="/boot-guard.js" defer></script>

    <!--
      启动占位（纯 CSS，无 JS / 无外链）：居中一个转圈。

      为什么必须有这一段：`<div id="root">` 原本是空的，而 React 侧的加载态也要等
      首屏那批 JS（gzip 约 285 KB）下载完才会渲染。也就是说从 HTML 到达到 React 挂载
      之间是**纯白屏**，弱网下能白几秒。这段内联 CSS 在 HTML 到达的同一帧就把转圈画
      出来，这段等待才有反馈。内联是刻意的：外链 CSS 又是一次往返。

      ⚠️ 2026-11-06 用户反馈：原来这里画的是「顶栏 + 两组卡片占位」的**假骨架**。
      弱网下用户先看到一整屏假卡片、几百毫秒后才跳成真实的加载态转圈 ——
      观感像「内容已经在加载了其实没有」，前半屏的等待全白费，还得再跳一次形态。
      所以改成只给一个转圈：React 侧的两处整页加载态（LoginScreen 的 checking 态、
      App.tsx 的列表 loading 分支）用的是同一个 40px 环（components/Spinner.tsx，
      规格就是本文件下面 `.bs-spinner` 那一条），两侧视觉一致，从打开到内容出现是
      「转圈 → 内容」，中间不再有形态跳变。

      ⚠️ 2026-11-06 用户第二次提「两个转圈不一样统一一下」：当时这里是自己画的
      border 环，React 侧却是 MUI 的 <CircularProgress>（SVG 弧线、弧长还会伸缩），
      同一段等待换了两种观感。现在两边共用**同一份定义** —— 就是本文件下面那一条
      `.bs-spinner`（40px / 3.5px / 22% / 0.9s，由 tests/spinnerUnified.test.ts
      逐项钉住）。
      ⚠️ 所以「改一处要记得同步另一处」这件事**已经不存在了**：改下面这一条就是改
      全站唯一的规格，React 侧靠同一个类名复用它 —— 不存在第二份要同步，去别处
      找第二份规格才是错的（尤其不要再往 src/index.css 写：spinnerUnified 第 2 条
      明令禁止那里出现同名规则）。

      元素 id 仍沿用 boot-skeleton（boot-guard.js 的 SKELETON_ID 与 main.tsx 的
      requestAnimationFrame 都按这个 id 找活：前者判「React 到底挂没挂载」，
      后者负责删节点），但内容已经不是一个骨架了 —— 别按 id 的字面意思理解。
      ⚠️ 改名会同时打断那两条链路，别改。

      CSP 允许 `style-src 'self' 'unsafe-inline'`（MUI/emotion 运行时插样式需要），
      所以这里不需要 nonce。转圈本身无任何文本，不参与对比度/焦点审计。
    -->
    <style>
      #boot-skeleton {
        /* 两档底色 = MUI 默认的 background.default（本项目没覆盖 background）：
           亮 #fff / 暗 #121212。原来是 #f7f8fa / #12161c，React 接管的那一瞬间
           底色会浅一档（弱网下尤其明显：占位停得越久，那一下跳越扎眼），
           所以这里直接用 MUI 的取值，从占位到首帧连底色都不再变。 */
        --bs-bg: #ffffff;
        --bs-brand: #1976d2;
        position: fixed;
        inset: 0;
        z-index: 0;
        background: var(--bs-bg);
        padding: 20px;
        box-sizing: border-box;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Inter, "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        #boot-skeleton {
          --bs-bg: #121212;
          --bs-brand: #90caf9;
        }
      }
      /* 用户存过 light/dark 时以它为准：这两条选择器比上面的 #boot-skeleton 具体，
         会盖过 @media 那条（存的是 system 时 head 里那段脚本不写属性，继续跟系统）。 */
      html[data-boot-theme="dark"] #boot-skeleton {
        --bs-bg: #121212;
        --bs-brand: #90caf9;
      }
      html[data-boot-theme="light"] #boot-skeleton {
        --bs-bg: #ffffff;
        --bs-brand: #1976d2;
      }
      /* ============================================================
         全站唯一一处「转圈」规格：.bs-spinner（40px 外径 / 3.5 描边 / 22% 轨道 / 0.9s 匀速）
         ------------------------------------------------------------
         ⚠️ 它必须待在文档头，而不是 src/index.css 那个 CSS 包：这段存在的全部
            理由就是「HTML 一到就有东西可画」—— 首帧不许等 JS，也不许等 CSS 包。
         谁在用它（同一个类名、同一份定义）：
           · 本页的启动占位：`#boot-skeleton` 里的
             `<svg class="bs-spinner">`（两个 <circle>：轨道 + 弧）
           · React 侧的整页加载态：`components/Spinner.tsx`（登录检查态 /
             站点列表 loading）渲染同一份 `<svg class="bs-spinner" data-mode=…>` 标记
         所以这条规则**故意不带作用域**（原来写的是 `#boot-skeleton .bs-spinner`）。
         一个类名、一处定义 = 两边漂移在结构上不可能发生
         （tests/spinnerUnified.test.ts 断言的是「真的只有一份」）。

         ⚠️⚠️ 为什么是**内联 SVG** 而不是 CSS border 环 —— 别「优化」回去 ⚠️⚠️
         32.4.0 第一次交付时这里画的是 border 环（`border: 3.5px solid` + 一段
         `border-top-color`）。CI 的「首屏体感审计」当场红：回访 FCP 148ms → **504ms**、
         冷启动 1904 → 3084，而 LCP 几乎没动（504 = 504）——「早期那次绘制不再被算作
         内容」的指纹。禁 JS 的受控实验（真实构建产物 + 三组 data: URL）证明：
           · 纯 CSS border 环 → paint 条目只有 `first-paint`，**没有 FCP**；
           · 内联 `<svg><circle>` → `first-paint` + **`first-contentful-paint`**；
           · 纯文本（对照组）→ 两者都有（说明环境本身能报 FCP）。
         Chrome 不把 border 环算作内容绘制，SVG 算。而 32.3.0 的 FCP 锚点其实一直是
         LoginScreen 那枚 MUI CircularProgress —— 它渲染的正是内联 <svg>。
         换成 SVG 之后 FCP 回到「JS 到达之前」，两个预算一起恢复余量，
         用户实际看到东西的时刻一点没变。顺带一个好处：`stroke-width: 3.5`
         是 SVG 用户单位，不再像 border 那样被 subpixel 取整成 3px。

         几何（改任何一个数都要重算，spinnerUnified 有断言钉着）：
           r = 18.25、stroke-width = 3.5 → 外径 18.25×2 + 3.5 = **40**，
           内径 33 —— 与原来 `width:40px + box-sizing:border-box + border:3.5px`
           的几何完全等价。
           周长 2π×18.25 ≈ 114.67，弧取四分之一 ≈ 28.67（`stroke-dasharray`），
           正好是原来 `border-top` 那一段的弧长。
           `rotate(-135 20 20)` 也别省：SVG 的 dash 从 3 点钟方向起算，转 -135°
           之后那 90° 弧正好居中在 12 点钟，和原来 `border-top-color` 的位置一致 ——
           减少动效时它是个静态帧，位置不一样用户看得出来。

         颜色走 --bs-brand：占位在 `#boot-skeleton` 里，继承那边按主题设的值；
         React 渲染在别处、继承不到，就落到兜底值 #1976d2（亮色档）。
         暗色档由组件按 theme.palette.mode 打的 data-mode="dark" 现场覆盖，
         见下面紧跟的那条规则 —— 占位不需要它（它有自己的 --bs-brand）。
         轨道用 `stroke-opacity: 0.22`（等价于原来的 color-mix 22%，都是 alpha 合成；
         **别改成 rgba() 硬编码**，那样暗色档就断了）。
         ============================================================ */
      .bs-spinner {
        display: block;
        width: 40px;
        height: 40px;
        animation: bs-spin 0.9s linear infinite;
      }
      .bs-spinner circle {
        fill: none;
        stroke-width: 3.5;
        stroke: var(--bs-brand, #1976d2);
      }
      .bs-spinner .bs-spinner-track { stroke-opacity: 0.22; }
      .bs-spinner .bs-spinner-arc {
        /* 弧 28.67 + 空白 86 = 周期 114.67；2π×18.25 ≈ 114.668，所以一圈正好一段 90° 弧。
           ⚠️ 这「正好」其实有 0.741px 的余量，而且余量的算法不是 2πr：
              Chrome 的 getTotalLength() 对 <circle> 给的是 0.99356 × 2πr（r=18.25 → 113.929；
              用 <path> 画的圆反而是 1.00014 × 2πr），是贝塞尔近似弧长带来的偏差，r 变比例不变。
              周期 114.67 比这条实际路径长 0.741px（0.65%）⇒ 一圈之内 dash 模式还没走完就回到起点，
              所以只画出一段弧（2026-11-06 QA 冻结动画后逐度采样实测：单段 227°→313°，居中 270°=12 点钟）。
           ⛔ 千万别把空白段改小「取个整」：那 0.65% 是唯一挡着第二段弧的东西。
              段数由**周期**（弧 + 空白）决定，不是只由空白段决定 —— 同一套采样（冻结动画、
              裁到环、沿 r=18.25 采 1440 点、数连续段）里：
                · `28.67 86`（周期 114.67）→ **1 段**，227°→313°（86.3°，就是我们看到的）；
                · `28.67 18.7`（周期 47.37）→ **看着该是 3 段，实测只有 2 段**：
                  (15°→108°, 93.3°) + (166°→313°, 147.5°) —— 最后一段在路径尾部被截断、
                  正好停在接缝上，和从同一个接缝开始的第一段连成一段；
                · `10 18.7`（周期 28.7）→ **4 段**，47–79 / 138–169 / 227–256 / 313–346。
              ⚠️ 结论是方法论：`ceil(周长 / 周期)` 这种心算**只会多数、不会少数**（它默认图案不跨接缝），
                 段数只能实测 —— 第二臂就是被这么算错的（手算 3，实测 2）。
              另外这条余量依赖 Chrome 的近似实现：换成按真圆弧算 dash 的实现，路径长就回到 114.668，
              余量只剩 0.0019px（视觉不可见，但已经在临界上）—— 所以 gap 只会越改越危险，别动它。 */
        stroke-dasharray: 28.67 86;
      }
      /* 暗色档：只给 React 侧用（它打 data-mode）。启动占位走的是 #boot-skeleton
         那套 --bs-brand，不需要这条 —— 更不能给它也打属性，否则两份来源又开始打架。 */
      .bs-spinner[data-mode="dark"] {
        --bs-brand: #90caf9;
      }
      @keyframes bs-spin {
        to { transform: rotate(360deg); }
      }
      /* 尊重系统的「减少动效」：只留静态圆环，旋转会让人分心（前庭敏感）。
         这条也不带作用域 —— 启动占位与 React 侧**同时**停转是结构保证，
         不再需要在两个文件里各写一遍（那种写法一旦漏一处，就是「启动环停着、
         React 环还在转」的不对称）。 */
      @media (prefers-reduced-motion: reduce) {
        .bs-spinner { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- 与上面的 #boot-skeleton 样式配套；React 挂载后由 main.tsx 兜底移除。
           ⚠️ 内联 SVG 不是随便写的：纯 CSS border 环不被 Chrome 算作内容绘制
           （只有 first-paint、没有 FCP），会让首屏 FCP 一直等到真正的文本 ——
           理由与受控实验记在上面 .bs-spinner 的注释里，别改回 border。 -->
      <div id="boot-skeleton" aria-hidden="true">
        <svg class="bs-spinner" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true">
          <circle class="bs-spinner-track" cx="20" cy="20" r="18.25" />
          <g transform="rotate(-135 20 20)">
            <circle class="bs-spinner-arc" cx="20" cy="20" r="18.25" />
          </g>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
