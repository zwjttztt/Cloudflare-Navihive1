# gitleaks 配置 —— CI 里那步「密钥扫描」用（.github/workflows/ci.yml）。

# 复用官方规则集（AWS / GitHub token / 私钥 / 通用高熵串…），只在上面开白名单。
[extend]
useDefault = true

# 本仓库的安全背景（决定了这个文件的写法，改之前先读一遍）：
#   - Git 历史里**曾经明文提交过** AUTH_SECRET / AUTH_PASSWORD / AUTH_USERNAME。
#     历史扫不扫都救不回来 —— 唯一的解是「用新密钥覆盖 + 改掉对应密码」，见 wrangler.jsonc 文件头。
#   - 所以 CI 只扫工作区文件（--no-git）：它的职责是拦住「新的密钥又被写进仓库」，
#     不是复述已经发生过的事。扫历史只会得到一条永远修不好的红灯，然后被习惯性忽略。
[allowlist]
# 白名单按「文件路径」放行：这些地方出现高熵串是有正当理由的
paths = [
    # integrity 是 base64 摘要，天生「像密钥」，一行一个，误报率 100%
    '''package-lock\.json$''',
    # 测试用例里的假数据（模拟令牌 / 哈希散列）
    '''tests/''',
    # 浏览器端那套内存 mock，值是写死的假账号
    '''src/API/mock\.ts''',
    # 单测脚本的产物目录（script/tmp-tests），内容是从 tests/ 拷出来的
    '''script/tmp-tests/''',
]

# 值本身带着这些字样的，一律不算密钥
regexes = [
    '''(?i)(dummy|fake|mock|example|sample|placeholder|redacted|changeme)''',
    '''(?i)^(ci-token|test-token)$''',
]
