# 持续集成：四个并行 job + 一个汇总判定。
#
# 2026-10-31 拆分，依据是 CI #41159720927 的**实测逐步骤耗时**（拆分前是单 job 26 步串行，整场 712s）：
#   覆盖率分层门禁 278s｜单元测试（含组件）154s｜npm ci 49s｜浏览器冒烟 38s｜构建 35s｜类型检查 31s｜
#   代码规范 29s｜视觉回归 19s｜可访问性审计 14s｜严格下标守卫 13s｜首屏体感审计 11s｜
#   定时任务 e2e 9s｜对比度审计 6s｜gitleaks 4s｜其余（六条 e2e / 探针 / 依赖巡检 / 体积预算）各 1~3s。
#
# 结论有点反直觉：**时间大头不是 e2e**（七条 e2e 加起来只有 21s），而是覆盖率与单测这两支
# 长杆 —— 两者相加占整场 61%。所以拆分依据是「这条检查需不需要构建产物、彼此有没有依赖」，
# 不是「按功能把 e2e 摊开」：把 2s 的活挪到别的 runner 上，省下来的只是 runner 启动时间。
#
#   ① lint_and_types  静态检查（密钥 / 依赖漏洞 / 类型 / 严格下标 / 代码规范）   ~130s
#   ② unit            单元测试（含组件）                                    ~205s
#   ③ coverage        覆盖率两层门禁（拆分后的关键路径）                       ~330s
#   ④ build_and_e2e   需要构建产物的一切（构建 → 体积 → 六条 e2e → 五条审计）   ~195s
#   ⑤ verify          只汇总判定，不跑检查（**沿用原 job 名**，别改）
#
# job id 一律用下划线：`needs.<id>.<prop>` 里的连字符在 GitHub Actions 表达式里
# 有被当成减号解析的风险，一旦不被接受就是整份工作流解析失败、一个 job 都不跑。
# 可读性由各 job 的中文 `name:` 承担（Actions 页面显示的是 name，不是 id）。
#
# 拆分不改语义：26 个步骤一步不少，命令 / env / continue-on-error 全部照抄。特别注意：
#   · gitleaks 仍在 npm ci **之前**（理由见那一步的注释）；
#   · NAVIHIVE_STRICT_D1 仍**逐步骤**声明，不提到 job 级 —— 提到 job 级会让本来没声明它的
#     步骤（构建 / 冒烟 / 各审计）也吃上这个开关，那就是语义变化；
#   · 视觉回归仍 continue-on-error: true（观察期不卡门）；
#   · coverage 那边的锁与清理逻辑一行没动：拆并行后各 job 在不同 runner 上，script/tmp-tests
#     本来就不会互删，但那是「顺便消失的问题」，不构成删掉防御逻辑的理由。
#
# 冒烟用的是 script/ci-smoke.mjs —— 零依赖、只需要一个已装好的 Chrome，
# 所以直接借 ubuntu runner 自带的 google-chrome，不用装 playwright/puppeteer。
#
# 本地等价命令：npm run ci（本地仍是单进程串行，步骤顺序与这里的分组不完全相同）
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支上的新提交把旧的跑批取消掉，省 runner。
# 工作流级：拆分后四个 job 会被一起取消（这正是想要的 —— 半个跑批留在那儿没有意义）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 为什么这些步骤归到一组：全是「只读源码、不需要构建产物、彼此也没有依赖」的静态检查。
  # 合在一组省三次 runner 启动；拆开也压不出并行收益 —— 这里面最慢的一步也才 31s。
  lint_and_types:
    name: 静态检查（类型 / 规范 / 依赖安全 / 密钥扫描）
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      # 密钥扫描：谁把 AUTH_SECRET / AUTH_PASSWORD / WebDAV 口令写进文件，这一步就拦下来。
      #
      # 三个刻意的取舍：
      #   1. 只扫**工作区文件**（--no-git）。本仓库历史里曾有明文密钥，扫历史会得到一条
      #      永远修不好的红灯 —— 而历史里的东西也救不回来，正解是轮换密钥。
      #      这一步的职责是「拦住新的泄漏」，不是复述已经发生过的事。
      #   2. 排在 npm ci **之前**：那时候没有 node_modules、没有 dist，
      #      扫描范围天然等于「提交进来的文件」，不用再写一堆路径排除。
      #   3. 用固定版本镜像而不是 latest：gitleaks 每次更新规则集都可能带来新命中，
      #      升级应该是看得见的变更（改这个 tag），不是某天 CI 突然变红。
      # 白名单在仓库根目录 .gitleaks.toml（lock 文件的 integrity 摘要、测试假数据…）。
      - name: 密钥扫描（gitleaks）
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.30.1 detect \
            --source /repo --config /repo/.gitleaks.toml \
            --no-git --redact -v

      # ⚠️ 这一步必须待在 gitleaks **之后**（理由见上）。
      # cache: 'npm' 缓存的是 ~/.npm（不是 node_modules），恢复动作就发生在这一步 ——
      # 仍然晚于密钥扫描，所以「扫描范围 = 提交进来的文件」这条不变量没被破坏。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 仓库已提交 package-lock.json，用 ci 保证依赖树与锁定版本完全一致。
      #
      # 这里**不要**加 --legacy-peer-deps：MUI 7 时代的 peer 告警已经随大版本升级消失
      # （本地 npm ci 实测无冲突），留着它只会让以后真正的 peer 冲突被静默跳过 ——
      # 那正是「装上才发现跑不起来」的那类问题。
      - name: 安装依赖
        run: npm ci

      # 依赖漏洞扫描，两段分工（2026-10-29 改）：
      #
      # 1) 第一段是**门禁**：只看生产依赖（--omit=dev），有 high/critical 就直接红。
      #    以前这里只有一句 `npm audit --audit-level=high || true` —— 永远绿，
      #    等于没有扫描：真出了 high 漏洞，CI 也照样放行，没人会去看日志。
      #    为什么要 --omit=dev：devDependencies 全是构建 / 测试工具，不进产物、
      #    不进镜像；对它们的告警硬失败只会逼人习惯性忽略 CI（而这正是上一版的病）。
      #    ⚠️ 改这条之前必须本地确认它是 0 漏洞，否则一提交 CI 立刻红。
      # 2) 第二段是**只报告**：全量（含 dev）审计继续跑，但不拦截 ——
      #    间接依赖的告警常常一时修不动，交给 Dependabot 每周开 PR 跟进
      #    （.github/dependabot.yml），而不是卡住每一次合并。
      - name: 依赖安全门禁（生产依赖，high/critical 即失败）
        run: npm audit --audit-level=high --omit=dev

      - name: 依赖安全巡检（全量，仅报告）
        run: npm audit --audit-level=high || true

      - name: 类型检查
        run: npm run typecheck

      # 严格下标守卫（Q-3 棘轮）：跑 tsconfig.strict-idx.json（noUncheckedIndexedAccess
      # 全开、include 覆盖全部 src），断言所有报错文件都登记在 script/strict-idx-exempt.json。
      # 「新文件默认进严格层」靠这条机械保证 —— 新写的文件只要漏判空下标就红，不靠人记；
      # 豁免清单只能 shrink（条目数不得超过 script/.strict-idx-baseline、due 过期即红）。
      - name: 严格下标守卫（Q-3 棘轮）
        run: npm run check:strict-idx

      # 只让 error 失败（warning 如 exhaustive-deps / fast-refresh 留着看，不阻断）。
      # --max-warnings 设成 0 会因为 MUI 的正常写法天天红，没人会真去修。
      - name: 代码规范
        run: npm run lint

  # 为什么单独一组：单元测试（含组件）154s，与构建完全无关 —— `npm run test` 在 dist 不存在时会让
  # bundleBudget 用例**主动跳过**，这与拆分前「test 排在 build 之前」的顺序等价（语义没变）。
  # 真正的首屏体积硬门禁在 build_and_e2e 的 check:budget（见那一步的注释）。
  # 不和 coverage 串在一起排队：那一组要 278s，串行等于让单测陪跑。
  unit:
    name: 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 同 lint_and_types：ci 保依赖树与锁定版本一致；不加 --legacy-peer-deps（那会静默跳过
      # 以后真正的 peer 冲突 —— 详见那一组同名步骤的长注释）。
      - name: 安装依赖
        run: npm ci

      # ⚠️ 名字别写回「纯函数单测」：这一步跑的是 `npm run test`（全套，含 .dom.test.tsx
      # 那几千条组件用例），不是只跑纯函数。名字写窄了，下一个人就会照着名字把它改成
      # 只跑 pure —— DOM 那一半会**静默失去 CI 覆盖**，而没有任何东西会报错。
      - name: 单元测试（含组件）
        run: npm run test

  # 为什么单独一组：278s 是整条流水线最长的一步，拆分后它就是**关键路径** ——
  # 只有让它独占一台 runner，其它检查才不用排队等它。它同样不依赖构建产物。
  # ⚠️ coverage.mjs / unit-tests.mjs 里的锁与 tmp-tests 清理逻辑保持原样：拆并行后各 job
  #    在独立 runner 上，互删问题确实不存在了，但那不是「可以删防御」的理由。
  coverage:
    name: 覆盖率分层门禁
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 同 lint_and_types（ci 保依赖树一致 / 不加 --legacy-peer-deps）。
      - name: 安装依赖
        run: npm ci

      # 覆盖率分层门禁（零依赖，不依赖构建产物）：
      # 按层统计「哪个源文件从未被任何用例间接引入」，并对每个层设文件触及率下限。
      # 现在绿，抓的是以后往某个层塞了没测的文件。纯类型声明 / 入口文件已排除，
      # 不会逼出无意义测试（详见 script/coverage.mjs 的 EXCLUDE 与 MIN_TOUCH）。
      - name: 覆盖率分层门禁
        run: npm run check:coverage

  # 为什么这些步骤归到一组：它们**都依赖构建产物**（dist/ 或 dist-server/），
  # 且彼此有严格顺序 —— 构建必须在体积门禁与所有 e2e 之前，各审计必须在构建之后。
  # 这组里最慢的是冒烟 38s 与构建 35s，再拆开收益只有个位数秒，反而多三次 runner 启动。
  build_and_e2e:
    name: 构建 + 端到端 + 浏览器审计
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 同 lint_and_types（ci 保依赖树一致 / 不加 --legacy-peer-deps）。
      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      # 首屏体积预算（**必须排在构建之后**）：
      # 另一个 job 里的 `npm run test` 跑在构建之前（那边根本没有 dist），而 bundleBudget
      # 用例在 dist 不存在时是主动跳过的 —— 也就是说那条守卫在 CI 里从来没真正生效过，
      # 只在本机「先 build 再 test」时才量得到。这里单独再跑一次，才是真正的硬门禁：
      # 谁把一个懒加载组件改回同步 import，这一步就红，而不是等用户觉得首屏变慢。
      - name: 首屏体积预算
        run: npm run check:budget

      # 后端 API 的真实端到端：起一个 wrangler dev（本地 D1），按人手操作的顺序
      # 打 20 条断言。前面几步（单测 / 构建）都碰不到真实后端 —— 而「新库首次登录
      # 必须先改密」「改密会使当前令牌失效」「/api/init 不返回数据」这类契约，
      # 只有真打一遍接口才会暴露。必须排在构建之后：脚本跑的是 dist 里的产物。
      - name: 后端 API 端到端
        # NAVIHIVE_STRICT_D1=1：打开 server/sqlite-d1.ts 的「D1 严格模式」。
        # 本机 SQLite 的变量上限是 32766、也没有语句数上限，D1 的限制（单条 SQL
        # 100 个绑定参数 / 100 KB 语句长度）本机会被悄悄吞掉，评审里已经因为这
        # 个漏掉 4 处同源缺陷。打开后违反就**抛错**，于是「本机全绿、上线必炸」
        # 在 CI 里就红。
        # ⚠️ 只有跑在自托管 server/（Node + SQLite）上的步骤真的会走这套检查
        # （e2e:share-extra / probe:edge）；走 workerd 的那几条用的是 D1 模拟器，
        # 读不到这个适配器 —— 所以这一开就红的话，一定是自托管路径真有问题。
        env:
          NAVIHIVE_STRICT_D1: "1"
        run: npm run e2e

      # 分享功能的端到端：起一个 wrangler dev（本地 D1），建一条带口令的笔记分享和
      # 一条分组分享，然后用匿名 cookie 真打一遍完整链路：
      # 匿名访问 401 + needPassword → 口令错 401 → 口令对拿到正文（且账号字段被脱敏）
      # → PUT 更新 token 不变 → PATCH 405 → DELETE 撤销 → 撤销后 404。
      # 分享是「线上从未实测、且以前零 e2e 覆盖」的成片功能，而它坏了是静默的：
      # 链接打不开，只是别人收不到内容。
      - name: 分享功能端到端
        # NAVIHIVE_STRICT_D1=1：打开 server/sqlite-d1.ts 的「D1 严格模式」。
        # 本机 SQLite 的变量上限是 32766、也没有语句数上限，D1 的限制（单条 SQL
        # 100 个绑定参数 / 100 KB 语句长度）本机会被悄悄吞掉，评审里已经因为这
        # 个漏掉 4 处同源缺陷。打开后违反就**抛错**，于是「本机全绿、上线必炸」
        # 在 CI 里就红。
        # ⚠️ 只有跑在自托管 server/（Node + SQLite）上的步骤真的会走这套检查
        # （e2e:share-extra / probe:edge）；走 workerd 的那几条用的是 D1 模拟器，
        # 读不到这个适配器 —— 所以这一开就红的话，一定是自托管路径真有问题。
        env:
          NAVIHIVE_STRICT_D1: "1"
        run: npm run e2e:share

      # 分享补充面端到端：跑在自托管 server/（Node + SQLite）上，与上一条互补 ——
      # 那条在 workerd 上覆盖「创建 → 401 needPassword → 口令错/对 → 撤销后 404」主干，
      # 这条补它没碰的三块：浏览计数防刷（cookie 当日戳去重）、附件公开取图
      # （无口令分享匿名可取；受口令分享必须先验对口令拿会话 cookie 且带 ?share）、
      # 分组分享的口令流程与字段脱敏（sites 只回 name/url/description/icon）。
      # 另外它也是 home 部署形态（自托管）自己的链路验证。
      - name: 分享补充面端到端
        # NAVIHIVE_STRICT_D1=1：打开 server/sqlite-d1.ts 的「D1 严格模式」。
        # 本机 SQLite 的变量上限是 32766、也没有语句数上限，D1 的限制（单条 SQL
        # 100 个绑定参数 / 100 KB 语句长度）本机会被悄悄吞掉，评审里已经因为这
        # 个漏掉 4 处同源缺陷。打开后违反就**抛错**，于是「本机全绿、上线必炸」
        # 在 CI 里就红。
        # ⚠️ 只有跑在自托管 server/（Node + SQLite）上的步骤真的会走这套检查
        # （e2e:share-extra / probe:edge）；走 workerd 的那几条用的是 D1 模拟器，
        # 读不到这个适配器 —— 所以这一开就红的话，一定是自托管路径真有问题。
        env:
          NAVIHIVE_STRICT_D1: "1"
        run: npm run e2e:share-extra

      # 接口边界探针：往自托管服务打一批畸形 / 超限 / 异常输入，**只找 5xx**。
      # 5xx 是服务端自己崩了，与 4xx（正确地拒绝）性质完全不同 —— 500 会触发告警、
      # 客户端会当故障重试。首次落地实测命中 9 处 500，根因都是同一个形状：
      # `const data = await request.json(); data.title` 在 body 为 null 时抛 TypeError。
      # 修完由 tests/jsonBodyGuard.test.ts 静态钉住「不许再裸解析」，
      # 这条则是**运行时**那半：它才能证明「真的不 500 了」。
      - name: 接口边界探针（只找 5xx）
        # NAVIHIVE_STRICT_D1=1：打开 server/sqlite-d1.ts 的「D1 严格模式」。
        # 本机 SQLite 的变量上限是 32766、也没有语句数上限，D1 的限制（单条 SQL
        # 100 个绑定参数 / 100 KB 语句长度）本机会被悄悄吞掉，评审里已经因为这
        # 个漏掉 4 处同源缺陷。打开后违反就**抛错**，于是「本机全绿、上线必炸」
        # 在 CI 里就红。
        # ⚠️ 只有跑在自托管 server/（Node + SQLite）上的步骤真的会走这套检查
        # （e2e:share-extra / probe:edge）；走 workerd 的那几条用的是 D1 模拟器，
        # 读不到这个适配器 —— 所以这一开就红的话，一定是自托管路径真有问题。
        env:
          NAVIHIVE_STRICT_D1: "1"
        run: npm run probe:edge

      # 定时备份（cron）的端到端：用 --test-scheduled 把 scheduled handler 挂到
      # /__scheduled 上，真跑一次自动备份。
      # wrangler 本地模式不会真的按 cron 触发，所以「定时备份会不会真的写出一份
      # 备份、会不会把上一份自动备份清掉、会不会误删手动备份」这条链路以前只有
      # 纯逻辑单测（cronLogic）盯着，从没端到端跑过 —— 而它一旦坏了是静默的：
      # 备份默默不写，发现时已经没有可恢复的数据。
      - name: 定时任务端到端
        # NAVIHIVE_STRICT_D1=1：打开 server/sqlite-d1.ts 的「D1 严格模式」。
        # 本机 SQLite 的变量上限是 32766、也没有语句数上限，D1 的限制（单条 SQL
        # 100 个绑定参数 / 100 KB 语句长度）本机会被悄悄吞掉，评审里已经因为这
        # 个漏掉 4 处同源缺陷。打开后违反就**抛错**，于是「本机全绿、上线必炸」
        # 在 CI 里就红。
        # ⚠️ 只有跑在自托管 server/（Node + SQLite）上的步骤真的会走这套检查
        # （e2e:share-extra / probe:edge）；走 workerd 的那几条用的是 D1 模拟器，
        # 读不到这个适配器 —— 所以这一开就红的话，一定是自托管路径真有问题。
        env:
          NAVIHIVE_STRICT_D1: "1"
        run: npm run e2e:cron

      # WebDAV 备份的端到端：本地起一个 mock WebDAV 服务，让 worker 真的
      # MKCOL / PUT / PROPFIND / GET / DELETE 一遍。
      # 单测（webdav.test.ts）里的 fetch 是假的，只能证明「我们发出了什么」；
      # 这条能证明「发出去的东西真的能被网盘接住、再原样取回来」——
      # gzip 流的组装与解压、Basic 凭据的 UTF-8 编码、PROPFIND 的 XML 形态、
      # 以及「没开内网豁免时指向内网必须被挡下且根本没发出请求」。
      - name: WebDAV 备份端到端
        # NAVIHIVE_STRICT_D1=1：打开 server/sqlite-d1.ts 的「D1 严格模式」。
        # 本机 SQLite 的变量上限是 32766、也没有语句数上限，D1 的限制（单条 SQL
        # 100 个绑定参数 / 100 KB 语句长度）本机会被悄悄吞掉，评审里已经因为这
        # 个漏掉 4 处同源缺陷。打开后违反就**抛错**，于是「本机全绿、上线必炸」
        # 在 CI 里就红。
        # ⚠️ 只有跑在自托管 server/（Node + SQLite）上的步骤真的会走这套检查
        # （e2e:share-extra / probe:edge）；走 workerd 的那几条用的是 D1 模拟器，
        # 读不到这个适配器 —— 所以这一开就红的话，一定是自托管路径真有问题。
        env:
          NAVIHIVE_STRICT_D1: "1"
        run: npm run e2e:webdav

      # ubuntu-latest 预装了 google-chrome，ci-smoke.mjs 会自己找到它；
      # 万一某天镜像里没有了，这一步会明确报「没找到 Chrome」而不是静默跳过
      - name: 浏览器冒烟
        run: npm run smoke

      # 可访问性审计：触控目标尺寸（WCAG 2.5.8 的 24px）/ 无名控件 / 破图。
      # 左侧分组栏折叠后的圆点只有 10×10（实测 14×14）就是这么量出来的 ——
      # 原先脚本在仓库外的 harness/ 下，只能人工实跑，缺陷躺到专项排查才修。
      # 进 CI 之后每改一次量一次，不会再攒着。
      - name: 可访问性审计
        run: npm run audit:a11y

      # 对比度审计：亮 / 暗两态全量扫文本，不达 WCAG AA 即失败。
      # 主题切换没生效时脚本会直接判红（否则两态测的都是亮色，等于没测暗色态）。
      - name: 对比度审计
        run: npm run audit:contrast

      # 首屏体感审计：移动端 Slow-4G + CPU 4× 下量真实 FCP / LCP。
      # 体积守卫（check:budget）看的是字节，拦不住「关键渲染路径上多了阻塞块」——
      # 那种情况体积几乎不变、体感差一档。2026-10-21 首次落地实测 FCP 5.1s / LCP 6.0s，
      # 预算按实测 +35~40% 留余量（见 script/perf-audit.mjs 的注释）。
      # 2026-10-25 起改「多轮采样取中位数」（默认 3 轮，PERF_ROUNDS 可配），
      # 专门压 CI 机器负载抖动带来的假红；等首屏压到 600KB 之后要把预算一起收紧。
      - name: 首屏体感审计（多轮中位数）
        run: npm run audit:perf

      # 视觉回归：3 视口 × 5 场景的布局指纹比对（几何 / 样式 / 元素数 / 主题态）。
      # ⚠️ 先以**非阻断**方式接入（2026-10-24 全站复查行动项）：基线是在开发机上录的，
      # CI 是另一台机器，字体渲染/亚像素差异会让它在两边都「绿」不了 ——
      # 一上来就卡门只会训练出「随手 --update 重录」的坏习惯，那等于把回归网拆了。
      # 现在的用途是**让它天天跑、把差异暴露在日志里**，等基线改在统一容器里重录
      # （或把容差与采样收稳）之后再摘掉 continue-on-error 变真门禁。
      - name: 视觉回归（观察期，暂不卡门）
        run: npm run audit:visual
        continue-on-error: true

      - name: 失败时留一份截图/日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-smoke-logs
          path: |
            dist/
          retention-days: 5

  # 汇总判定。**沿用原 job 名**：拆分前它就是那个唯一的 job，可能有人按这个名字看状态、
  # 配分支保护规则 —— 改名等于让那些地方静默失效。
  # 它不跑任何检查：四个并行 job 跑在不同 runner 上，「这条流水线到底过没过」需要一个
  # 唯一的结论点，这里就是。
  # ⚠️ if: always() 不能去掉：没有它，只要有一个上游 job 失败，这个 job 会被**跳过**，
  #    而「跳过」在工作流级结论里不是 failure —— docker-publish.yml 读的正是工作流级
  #    conclusion，跳过会让「门禁没通过」变成一盏绿灯。同理下面不放过 success 以外的任何值：
  #    skipped 意味着那道门禁根本没跑。
  verify:
    name: 门禁汇总
    needs: [lint_and_types, unit, coverage, build_and_e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: 汇总四个并行 job 的结论
        env:
          R_LINT: ${{ needs.lint_and_types.result }}
          R_UNIT: ${{ needs.unit.result }}
          R_COV: ${{ needs.coverage.result }}
          R_BUILD: ${{ needs.build_and_e2e.result }}
        run: |
          echo "各并行 job 结论："
          printf '  %-16s %s\n' "lint_and_types" "$R_LINT"
          printf '  %-16s %s\n' "unit" "$R_UNIT"
          printf '  %-16s %s\n' "coverage" "$R_COV"
          printf '  %-16s %s\n' "build_and_e2e" "$R_BUILD"

          failed=""
          for pair in "lint_and_types:$R_LINT" "unit:$R_UNIT" "coverage:$R_COV" "build_and_e2e:$R_BUILD"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            # success 以外的任何值都算没通过：failure / cancelled / skipped 一个都不能放过
            if [ "$result" != "success" ]; then failed="$failed $name($result)"; fi
          done

          if [ -n "$failed" ]; then
            echo "::error::门禁未通过:$failed"
            exit 1
          fi
          echo "四个并行 job 全部 success"
