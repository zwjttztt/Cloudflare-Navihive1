# 全历史密钥扫描（每周一次 + 手动触发）。
#
# 与 CI 里那步的区别：CI 只扫工作区文件（--no-git），职责是「拦住**新的**密钥被写进来」；
# 这里扫**全部 Git 历史**，职责是「知道历史上到底漏了什么」。
#
# 为什么不放在 CI 里：本仓库历史里确实明文提交过管理员账号密码（早期 docker-entrypoint.sh），
# 那是**已经发生**的事，重写历史救不回来（正解是轮换）。把它挂到每次 push 上，只会得到一条
# 永远修不好、然后被习惯性忽略的红灯 —— 那比不扫更糟。
# 所以：定期跑、结果可见、**不阻断**任何流水线（continue-on-error），发现新命中再去轮换。
name: Secret History Scan

on:
  schedule:
    # 每周一 UTC 03:00（北京时间 11:00），避开 CI 的高峰
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 拉全量历史（fetch-depth: 0）：默认只拉最后一次提交，那就没得扫了
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --no-git 换成默认（扫 git）并给 --log-opts=--all：遍历所有提交、所有分支。
      # --redact：日志里只留指纹与位置，不把命中内容打进公开日志。
      # 历史里已有的命中是已知事实，不能让它卡住发布 —— 只报告。
      - name: 扫描全部 Git 历史中的密钥
        id: scan
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.30.1 detect \
            --source /repo --config /repo/.gitleaks.toml \
            --log-opts=--all --redact -v \
            --report-format json --report-path /repo/gitleaks-history.json

      - name: 汇总命中（不含密钥原文）
        if: always()
        run: |
          if [ ! -f gitleaks-history.json ]; then
            echo "没有生成报告文件（扫描未执行或提前退出）"
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const rows = JSON.parse(fs.readFileSync("gitleaks-history.json", "utf8") || "[]");
            if (!rows.length) { console.log("全历史扫描：0 命中"); process.exit(0); }
            const byRule = new Map();
            for (const r of rows) {
              const k = r.RuleID || "unknown";
              byRule.set(k, (byRule.get(k) || 0) + 1);
            }
            console.log(`全历史扫描命中 ${rows.length} 处：`);
            for (const [rule, n] of byRule) console.log(`  ${rule}: ${n}`);
            console.log("\n涉及文件（去重，前 30 行）：");
            for (const f of [...new Set(rows.map(r => r.File))].slice(0, 30)) console.log("  " + f);
            console.log("\n处置：历史里的密钥只能靠**轮换**解决（改密码 / 重设 secret），不要指望重写提交。");
          '

      - name: 上传报告产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-history
          path: gitleaks-history.json
          if-no-files-found: ignore
