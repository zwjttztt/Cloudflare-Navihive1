# 部署流水线 —— 目前只支持手动触发（push 自动部署已停用，见下面 on: 的说明）。
#
# 为什么要单独一份：Workers Builds（Cloudflare 侧的 GitHub 自动构建）在 2026-10-02 起
# 报 "The build token selected for this build has been deleted or rolled"，
# 也就是它存的构建令牌失效了，推送不再自动部署。那条要在 Cloudflare Dashboard 里修，
# 仓库这边改不了。这份流水线让部署重新掌握在自己手里，不依赖那个令牌。
#
# 触发方式：
#   - workflow_dispatch：Actions 页手动点 Run workflow（当前唯一入口）
#   - push 到 main：2026-10-02 13:52 起停用。原因是仓库的 CLOUDFLARE_API_TOKEN
#     secret 被清掉了（Secrets 数量变成 0），留着 push 触发会让每次推送都红一次。
#     要恢复：先到 Settings → Secrets → Actions 重新配好 secret，再把下面两行解注释。
#
# ⚠️ 启用 push 触发前务必先确认 secret 存在，否则每次推送都会失败一次。
name: Deploy

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm run build = tsc -b && vite build，类型错误会在这里直接拦下
      - name: Type check and build
        run: npm run build

      # 跑的是 npx wrangler deploy：@cloudflare/vite-plugin 会把重定向后的配置
      # 生成到 dist/cloudflare_navihive1/wrangler.json，不指定 --config 才能读到它。
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
