# 部署流水线 —— push 到 main 自动部署，也支持手动触发。
#
# 为什么要单独一份：Workers Builds（Cloudflare 侧的 GitHub 自动构建）在 2026-10-02 起
# 报 "The build token selected for this build has been deleted or rolled"，
# 也就是它存的构建令牌失效了，推送不再自动部署。那条要在 Cloudflare Dashboard 里修，
# 仓库这边改不了。这份流水线让部署重新掌握在自己手里，不依赖那个令牌。
#
# 触发方式：
#   - push 到 main：自动部署（配好 CLOUDFLARE_API_TOKEN 后已启用）
#   - workflow_dispatch：Actions 页手动点 Run workflow
#
# ⚠️ 停用自动部署前请先把下面的 push 触发器注掉，不要删整个文件 ——
#    删了 secret 却留着 push 触发，会让每次推送都变红。
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm run build = tsc -b && vite build，类型错误会在这里直接拦下
      - name: Type check and build
        run: npm run build

      # 跑的是 npx wrangler deploy：@cloudflare/vite-plugin 会把重定向后的配置
      # 生成到 dist/cloudflare_navihive1/wrangler.json，不指定 --config 才能读到它。
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
