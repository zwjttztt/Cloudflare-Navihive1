# NaviHive 自托管（方案 B）—— compose。
#
# 用法：
#   cp .env.example .env   # 改掉 AUTH_SECRET 等（.env 已在 .gitignore / .dockerignore 里）
#   docker compose up -d --build
#   docker compose logs -f navihive        # 看启动自检（缺 AUTH_SECRET 会告警）
#   docker compose exec navihive node -e "console.log(process.version)"
#
# 生产形态仍然是「宿主机 Nginx/Caddy 终止 TLS → 反代到 127.0.0.1:8787」，
# Nginx 配置用 deploy/nginx/sites-available/navihive-selfhost.conf（静态也走 Node，
# 这样 dist/client/_headers 保持安全头的唯一事实来源）。
# 手册：deploy/selfhost.md 第四节 B。
#
# 两个服务：navihive（业务）+ upgrader（唯一的特权点，见文件末尾）。

services:
  navihive:
    build: .
    image: navihive:latest
    container_name: navihive
    restart: unless-stopped
    # 默认以非 root 运行：镜像里 Dockerfile 已经 `USER node` 并把 /app chown 给 node，
    # 这里不再用 0:0 覆盖它。容器内 node 用户 uid=1000，命名卷（navihive-data）里的
    # 库和附件就以 1000 属主，符合最小权限原则。
    #
    # ⚠️ 迁移已有卷：2026-10-22 之前一直以 root 跑，卷里文件是 root 属主；直接切非 root
    # 会写不进库 / 附件。一次性把卷属主改掉即可（容器没起的时候跑）：
    #   docker run --rm -v navihive-data:/data alpine chown -R 1000:1000 /data
    # 全新部署（卷还是空的）不用管 —— 命名卷首次会从镜像 /app/data 拷贝，本就是 node 属主。
    #
    # 仍可用 NAVIHIVE_RUN_AS 覆盖（例如宿主绑定挂载目录属主是 root、必须 root 才写得进）。
    user: "${NAVIHIVE_RUN_AS:-node}"

    ports:
      # 默认只绑宿主机回环：TLS 由前面的反代终止，容器不直接面对公网。
      # 确认过风险再改成 "8787:8787"（那样就必须把 NAVIHIVE_TRUST_XFF 设 0）。
      - "127.0.0.1:${NAVIHIVE_PORT:-8787}:8787"

    environment:
      # 容器内必须听 0.0.0.0，端口映射才通得出去（Dockerfile 里也设了，这里显式再写一遍防漂移）
      NAVIHIVE_HOST: 0.0.0.0
      NAVIHIVE_PORT: "8787"
      # 库与附件落在命名卷里，容器重建不丢
      NAVIHIVE_DB: /app/data/navihive.db
      NAVIHIVE_FILES: /app/data/files
      # 挡着反代才设 1；端口直接暴露公网必须保持 0，否则改 X-Forwarded-For 就能换限速桶。
      # 默认 0（安全侧）：从旧版本升上来的部署请对照 deploy/selfhost.md 自查 .env。
      NAVIHIVE_TRUST_XFF: ${NAVIHIVE_TRUST_XFF:-0}
      # 只控制「要不要读反代覆盖写入的 X-Real-IP」，与上面那个开关独立：默认 0。
      # 配套条件：反代必须以覆盖模式写 X-Forwarded-For $remote_addr **且**写 X-Real-IP $remote_addr。
      # 用本仓 deploy/nginx/ 模板（它两个头都覆盖写）时，才把这两个开关**同时**设 1。
      NAVIHIVE_TRUST_X_REAL_IP: ${NAVIHIVE_TRUST_X_REAL_IP:-0}
      # 单容器 = 单实例，进程内定时任务放心开；扩容成多副本前必须设 0 并改走 POST /__cron
      NAVIHIVE_CRON: ${NAVIHIVE_CRON:-1}
      NAVIHIVE_CRON_TOKEN: ${NAVIHIVE_CRON_TOKEN:-}

      # Node 堆上限 256MB（2026-11-01）。⚠️ 必须在 compose 里传：Dockerfile 的
      # NODE_OPTIONS（--max-old-space-size=3072）写在 builder 阶段、只为构建期 tsc/vite
      # 服务，runtime 阶段的 ENV 里没有它（已核实 Dockerfile:35-37）——不传的话 runtime
      # 的 Node 会按宿主物理内存自动收堆上限，小 VPS 上经常收到几百 MB 甚至更大，
      # 一旦宿主吃紧 OOM-kill 第一个杀的就是这个常驻进程。
      # 384m 与 256MB 的联动关系：Node 常驻 RSS = JS 堆 + 代码/缓冲/线程栈等堆外开销，
      # 小站实测堆外约几十 MB，256MB 堆 + ~128MB 余量 = 384m 硬顶 —— 堆真涨到 256MB
      # 时先在 Node 侧抛 OOM（有日志可查），而不是被内核静默击杀。
      NODE_OPTIONS: --max-old-space-size=256

      # 升级时拉取的目标镜像；不设走 ghcr.io/zwjttztt/navihive:latest。
      # 升级器读同一个变量（见文件末尾），两边必须一致。
      NAVIHIVE_IMAGE: ${NAVIHIVE_IMAGE:-ghcr.io/zwjttztt/navihive:latest}

      # 升级请求写到这个共享卷，由 upgrader 服务消费（见文件末尾）。
      # 设了它就进入 spool 模式：本进程不再碰 Docker daemon，只写一个请求文件。
      NAVIHIVE_UPGRADE_SPOOL: /spool

      # :? = 没设置就让 compose 直接失败退出——别默默起一个「登录必然失败」的服务
      AUTH_SECRET: ${AUTH_SECRET:?没设 AUTH_SECRET：先在 .env 里放一个 openssl rand -hex 32}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      # 只在首次建库时当种子账号；库已存在则以 configs 表为准
      AUTH_USERNAME: ${AUTH_USERNAME:-root}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      # 从 D1 迁了数据就必须与线上一致，否则已加密的站点凭据解不开、老令牌全部失效
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}

    # 内存硬顶 384m（与上面 NODE_OPTIONS=256 联动，原因见那条注释）。
    # SQLite 全量备份/恢复的峰值也压在这个顶内；真不够会在 Node 侧先报 OOM，
    # 有日志可查，比被内核 OOM-kill 静默杀掉好排查得多。
    mem_limit: 384m

    volumes:
      - navihive-data:/app/data
      # ⚠️ 这里**不再挂 /var/run/docker.sock**（2026-10-22）。
      # 挂 sock 等于把宿主机 Docker 的完整控制权交给这个容器：容器一旦被攻破，
      # 攻击者就能起特权容器、挂宿主目录、读全部数据 —— 等于宿主机 root。
      # 试过用 socket-proxy 收权限（deploy/docker-socket-proxy.yml），实测跑不通：
      # compose 需要 create/stop/networks/volumes，而一旦放开 POST /containers/create，
      # 就等于把 daemon 全权交出去，加固归零。
      #
      # 现在「执行重建」由独立的 upgrader 服务做（见文件末尾）：本容器只往共享卷
      # 写一个请求文件，从此零 daemon 权限。
      - upgrade-spool:/spool

    # SQLite 单写者：别横向扩副本（每个副本会各写各的库），定时任务也会各跑一遍
    deploy:
      replicas: 1

    # 访问日志是每条 API 请求一行，不轮转能把小 VPS 的磁盘写满
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============ 升级器（2026-10-22）============
  # 为什么不放在应用容器里：那需要挂 /var/run/docker.sock，等于宿主机 root。
  # 把「执行重建」挪到这里之后：应用容器零 daemon 权限，只写 /spool/request；
  # 升级器持 sock，但**不开端口、不跑业务代码、不渲染用户内容**，攻击面极小。
  #
  # ⚠️ 四条不能改的细节：
  #   1. 只重建 navihive 自己（`up -d --force-recreate --no-deps navihive`）。
  #      不带服务名时 compose 会连 upgrader 一起检查/重建 —— 那是让执行升级的进程自杀。
  #   2. 挂载点必须是**宿主原路径**（/home/docker/navihive 挂到同名路径）。
  #      compose 会把运行时工作目录写进新容器的 com.docker.compose.project.working_dir
  #      标签，那是下一轮升级读坐标的唯一来源；挂到 /compose 会写歪，第二轮必失败。
  #   3. pull 用完整镜像名，再 tag 成 compose 里的 image 名：
  #      不同部署的 compose 里 image 可能是 navihive:latest 或 ghcr.io/...:latest，
  #      先 pull 真名再 tag，两种都能 up 成功（pull navihive:latest 会去 Hub 找，必失败）。
  #   4. 轮询而不是 inotify：共享卷在 overlayfs 上，事件不保证触发。
  upgrader:
    # 2026-11-01 从 docker:27-cli 钉到 docker:27.5-cli：Docker Hub 上 27.x 线的终点是
    # 27.5.1（27-cli / 27.5-cli / 27.5.1-cli 现指向同一份镜像，2025-02 之后未再更新），
    # 钉到 minor 位既冻结了主版本漂移，又不必跟着补丁号走。要完全冻结可换 27.5.1-cli。
    image: docker:27.5-cli
    container_name: navihive-upgrader
    restart: unless-stopped
    working_dir: /home/docker/navihive
    environment:
      NAVIHIVE_IMAGE: ${NAVIHIVE_IMAGE:-ghcr.io/zwjttztt/navihive:latest}
      # 回滚通知用（见上面 command 里的 wget）：空则跳过通知
      ALERT_WEBHOOK: ${ALERT_WEBHOOK:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        IMAGE="$${NAVIHIVE_IMAGE}"
        echo "[upgrader] 就绪：轮询 /spool/request（image=$$IMAGE）"
        while true; do
          if [ ! -f /spool/request ]; then sleep 2; continue; fi
          rm -f /spool/request
          started=$$(date +%s)000
          printf '{"phase":"pulling","image":"%s","error":"","startedAt":%s,"finishedAt":0}' "$$IMAGE" "$$started" > /spool/state.json
          echo "[upgrader] 拉取 $$IMAGE"
          if ! docker pull "$$IMAGE"; then
            printf '{"phase":"failed","image":"","error":"拉取镜像失败（详见 upgrader 容器日志）","startedAt":%s,"finishedAt":%s}' "$$started" "$$(date +%s)000" > /spool/state.json
            continue
          fi
          docker tag "$$IMAGE" navihive:latest 2>/dev/null || true
          # 升级前给当前（旧）镜像打回滚锚点：recreate 之后 latest 已是新镜像，旧镜像只剩这一份 ImageID
          PREV_ID=$$(docker inspect --format='{{.Image}}' navihive 2>/dev/null || true)
          if [ -n "$$PREV_ID" ]; then docker tag "$$PREV_ID" navihive:previous 2>/dev/null || true; fi
          printf '{"phase":"recreating","image":"","error":"","startedAt":%s,"finishedAt":0}' "$$started" > /spool/state.json
          echo "[upgrader] 重建 navihive"
          if docker compose -f docker-compose.yml -p navihive up -d --force-recreate --no-deps navihive; then
            # ---- 健康门禁：重建后新容器必须 healthy，否则回滚 previous ----
            GUARD_OK=""
            for _i in $$(seq 1 40); do
              ST=$$(docker inspect --format='{{.State.Health.Status}}' navihive 2>/dev/null || echo starting)
              if [ "$$ST" = "healthy" ]; then GUARD_OK=1; break; fi
              if [ "$$ST" = "unhealthy" ]; then break; fi
              sleep 3
            done
            if [ -z "$$GUARD_OK" ]; then
              echo "[upgrader] 新容器未在限期内 healthy（最后状态：$$ST），回滚到 navihive:previous"
              docker tag navihive:previous navihive:latest 2>/dev/null || true
              docker compose -f docker-compose.yml -p navihive up -d --force-recreate --no-deps navihive
              echo "[upgrader] 已回滚"
              # 回滚通知（2026-11-01）：回滚是「升级失败且已自动兜底」的信号，运维必须知道
              # —— 置之不理的话，下一次升级可能还在同一个坑里再摔一遍。镜像里是 alpine 的
              # busybox wget（支持 --header/--post-data），够发这条 JSON；$$ST 只可能是
              # healthy/unhealthy/starting 之类的枚举值，不含引号，直接内插进 JSON 是安全的。
              # 没配 ALERT_WEBHOOK 就跳过；发送失败只留日志，绝不影响回滚本身。
              if [ -z "$${ALERT_WEBHOOK:-}" ]; then
                echo "[upgrader] 未配置 ALERT_WEBHOOK，跳过回滚通知"
              else
                wget -qO- --header='Content-Type: application/json' \
                  --post-data="{\"text\":\"[NavHive] 升级回滚：新容器未在限期内 healthy（最后状态：$$ST），已回滚到 navihive:previous。请查 navihive-upgrader 与 navihive 日志。\"}" \
                  "$${ALERT_WEBHOOK}" >/dev/null 2>&1 \
                  || echo "[upgrader] 回滚通知发送失败（webhook 不可达？），不影响回滚结果"
              fi
            fi
            printf '{"phase":"done","image":"","error":"","startedAt":%s,"finishedAt":%s}' "$$started" "$$(date +%s)000" > /spool/state.json
            echo "[upgrader] 完成"
          else
            printf '{"phase":"failed","image":"","error":"重建失败（详见 upgrader 容器日志）","startedAt":%s,"finishedAt":%s}' "$$started" "$$(date +%s)000" > /spool/state.json
            echo "[upgrader] 失败"
          fi
        done
    volumes:
      # 只有这个容器持有 sock
      - /var/run/docker.sock:/var/run/docker.sock
      # 宿主原路径同名挂载：见上面第 2 条
      - /home/docker/navihive:/home/docker/navihive
      - upgrade-spool:/spool
    # 只跑 docker CLI + 轮询循环，128m 绰绰有余；给它设顶是防升级器自己失控吃内存
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

volumes:
  navihive-data:
  # 升级请求/状态在应用容器与升级器之间传递，只有这两个容器挂它
  upgrade-spool:
